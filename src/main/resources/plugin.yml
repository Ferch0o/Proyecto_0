name: DifficultyPlugin
version: '1.0'
main: me.difficulty.DifficultyPlugin
api-version: '1.21.5'
author: DifficultyProject
description: Plugin de dificultad progresiva para Minecraft 1.21

commands:
  day:
    description: Muestra el día actual del servidor.
    usage: /day
  setday:
    description: Cambia el día actual del servidor.
    usage: /setday <día>
    permission: difficulty.setday
  storm:
    description: Controla la Tormenta.
    usage: /storm <start|stop>
    permission: difficulty.admin
  sharedcure:
    description: Comparte descuentos de aldeanos curados anteriormente.
    usage: /sharedcure add
    permission: difficulty.sharedcure.admin

  givecorruptedstar:
    description: Entrega una Estrella Corrupta para pruebas.
    usage: /givecorruptedstar
    permission: difficulty.admin
  spawngiant:
    description: Genera un Zombie Gigante para pruebas.
    usage: /spawngiant
    permission: difficulty.admin

  giveexplosivecrossbow:
    description: Entrega una Ballesta Explosiva para pruebas.
    usage: /giveexplosivecrossbow
    permission: difficulty.admin
  spawninfrazombie:
    description: Genera un Infrazombie para pruebas.
    usage: /spawninfrazombie
    permission: difficulty.admin
  spawncorruptedzombie:
    description: Genera un Zombie Corrupto para pruebas.
    usage: /spawncorruptedzombie
    permission: difficulty.admin
  spawnscavenger:
    description: Genera un Carroñero para pruebas.
    usage: /spawnscavenger
    permission: difficulty.admin
  spawnelementalskeleton:
    description: Genera un Esqueleto Elemental para pruebas.
    usage: /spawnelementalskeleton
    permission: difficulty.admin
  spawngladiator:
    description: Genera un Gladiador para pruebas.
    usage: /spawngladiator
    permission: difficulty.admin
  spawnfuturisticcreeper:
    description: Genera un Creeper Futurista para pruebas.
    usage: /spawnfuturisticcreeper
    permission: difficulty.admin
  spawnspeedspider:
    description: Genera una Araña Velocista para pruebas.
    usage: /spawnspeedspider
    permission: difficulty.admin
  spawnabyssspider:
    description: Genera una Araña del Abismo para pruebas.
    usage: /spawnabyssspider
    permission: difficulty.admin
  spawnweaver:
    description: Genera una Tejedora para pruebas.
    usage: /spawnweaver
    permission: difficulty.admin
  spawngoliath:
    description: Genera una Goliat para pruebas.
    usage: /spawngoliath
    permission: difficulty.admin

  giveelementalpotato:
    description: Entrega una Patata Elemental para pruebas.
    usage: /giveelementalpotato
    permission: difficulty.admin
  giveday17materials:
    description: Entrega los materiales de la Patata Elemental.
    usage: /giveday17materials
    permission: difficulty.admin
  resetcurse:
    description: Restablece la Maldicion del Inframundo para pruebas.
    usage: /resetcurse <jugador>
    permission: difficulty.admin

  spawncorruptedblaze:
    description: Genera un Blaze Corrupto para pruebas.
    usage: /spawncorruptedblaze
    permission: difficulty.admin
  spawnphantomblaze:
    description: Genera un Blaze Fantasmal para pruebas.
    usage: /spawnphantomblaze
    permission: difficulty.admin
  spawnblazeking:
    description: Genera un Rey Blaze para pruebas.
    usage: /spawnblazeking
    permission: difficulty.admin
  spawncorruptedwither:
    description: Genera un Wither Corrupto para pruebas.
    usage: /spawncorruptedwither
    permission: difficulty.admin
  spawnfortressguardian:
    description: Genera un Guardián de la Fortaleza para pruebas.
    usage: /spawnfortressguardian
    permission: difficulty.admin
  spawncorruptedghast:
    description: Genera un Ghast Corrupto para pruebas.
    usage: /spawncorruptedghast
    permission: difficulty.admin
  spawndemonicghast:
    description: Genera un Ghast Demoníaco para pruebas.
    usage: /spawndemonicghast
    permission: difficulty.admin
  spawncorruptedpigman:
    description: Genera un Pigman Corrupto para pruebas.
    usage: /spawncorruptedpigman
    permission: difficulty.admin
  spawnninja:
    description: Genera un Ninja para pruebas.
    usage: /spawnninja
    permission: difficulty.admin
  spawncorruptedpiglin:
    description: Genera un Piglin Corrupto para pruebas.
    usage: /spawncorruptedpiglin
    permission: difficulty.admin
  spawnexplosivepiglin:
    description: Genera un Piglin Explosivo para pruebas.
    usage: /spawnexplosivepiglin
    permission: difficulty.admin
  spawnkingpiglin:
    description: Genera un Rey Piglin para pruebas.
    usage: /spawnkingpiglin
    permission: difficulty.admin
  spawncorruptedenderman:
    description: Genera un Enderman Corrupto para pruebas.
    usage: /spawncorruptedenderman
    permission: difficulty.admin
  spawnancestralenderman:
    description: Genera un Enderman Ancestral para pruebas.
    usage: /spawnancestralenderman
    permission: difficulty.admin
  giveelementalpearl:
    description: Entrega 16 Perlas Elementales para pruebas.
    usage: /giveelementalpearl
    permission: difficulty.admin

permissions:
  difficulty.setday:
    description: Permite modificar el día del servidor.
    default: op
  difficulty.admin:
    description: Permite utilizar comandos de desarrollo del plugin.
    default: op
  difficulty.sharedcure.admin:
    description: Permite habilitar descuentos compartidos.
    default: op
